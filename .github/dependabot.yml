version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github_actions:
        patterns:
          - "*"
  - package-ecosystem: terraform
    directory: "/terraform"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      terraform:
        patterns:
          - "*"
