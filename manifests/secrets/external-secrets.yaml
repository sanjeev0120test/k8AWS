apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: eso-aws-credentials
            key: access-key-id
            namespace: external-secrets
          secretAccessKeySecretRef:
            name: eso-aws-credentials
            key: secret-access-key
            namespace: external-secrets

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongo-credentials
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: mongo-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: /k8AWS/mongo-username
    - secretKey: password
      remoteRef:
        key: /k8AWS/mongo-password

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: /k8AWS/grafana-admin-username
    - secretKey: password
      remoteRef:
        key: /k8AWS/grafana-admin-password
