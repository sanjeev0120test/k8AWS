apiVersion: v1
kind: ConfigMap
metadata:
  name: api-app
  namespace: app
data:
  app.py: |
    import os
    import sys
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import quote_plus

    MONGO_USER = os.environ.get("MONGO_USER", "admin")
    MONGO_PASS = os.environ.get("MONGO_PASS", "")
    MONGO_HOST = os.environ.get("MONGO_HOST", "mongo.app.svc.cluster.local")
    MONGO_PORT = int(os.environ.get("MONGO_PORT", "27017"))

    def mongo_ping():
        try:
            from pymongo import MongoClient
            user = quote_plus(MONGO_USER)
            password = quote_plus(MONGO_PASS)
            uri = f"mongodb://{user}:{password}@{MONGO_HOST}:{MONGO_PORT}/admin?authSource=admin"
            client = MongoClient(uri, serverSelectionTimeoutMS=3000)
            client.admin.command("ping")
            return True, "mongo connected"
        except Exception as exc:
            return False, str(exc)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            ok, msg = mongo_ping()
            body = f"K8AWS API | mongo_ok={ok} | {msg}\n"
            code = 200 if ok else 503
            self.send_response(code)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(body.encode())

        def log_message(self, fmt, *args):
            sys.stderr.write("%s - %s\n" % (self.address_string(), fmt % args))

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: app
  labels:
    app: api
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: k8aws-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/name: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      initContainers:
        - name: install-deps
          image: python:3.12-slim-bookworm
          command: ["pip", "install", "--target=/deps", "pymongo==4.7.3"]
          volumeMounts:
            - name: deps
              mountPath: /deps
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: api
          image: python:3.12-slim-bookworm
          command: ["/bin/sh", "-c"]
          args:
            - export PYTHONPATH=/deps && python /app/app.py
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: username
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
            - name: deps
              mountPath: /deps
      volumes:
        - name: app
          configMap:
            name: api-app
        - name: deps
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: app
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: http
      name: http
